[project]
name = "mcp-ical"
version = "0.1.0"
description = "A Model Context Protocol server providing tools for CRUD operations for the mac-os calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["loguru>=0.7.3", "mcp[cli]>=2.0.0", "pyobjc>=12.2.2"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-random-order>=1.2.0",
    "ruff>=0.16.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[project.scripts]
mcp-ical = "mcp_ical.server:main"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["mcp_ical"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.uv]
extra-build-dependencies = [
    "setuptools",
    "wheel",
]
