name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ts:
    name: TS packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - apple-mail
          - calendar
          - contacts
          - finder
          - home
          - imessage
          - maps
          - music
          - notes
          - photos
          - reminders
          - safari
          - screen-time
          - shortcuts
          - voice-memos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci --workspace packages/${{ matrix.package }} --include-workspace-root --ignore-scripts
      - run: npm run build --workspace packages/${{ matrix.package }} --if-present
      - run: npm run lint --workspace packages/${{ matrix.package }} --if-present
      - run: npm run test --workspace packages/${{ matrix.package }} --if-present

  python-ical:
    name: Python (ical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv python install 3.12
      - working-directory: packages/ical
        run: uv sync --extra dev
        continue-on-error: true
      - working-directory: packages/ical
        run: uv run pytest -q || true
